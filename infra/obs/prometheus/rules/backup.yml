# Backup recording rules. Plan T20.
#
# Litestream 0.5 exposes no "last snapshot" timestamp. It counts uploads to R2 in
# `litestream_replica_operation_total{operation="PUT"}`. Each WAL sync with changes and
# each hourly snapshot is one PUT. This rule turns the counter into "time of the last
# upload", so the `BackupStale` alert (T21), /stack (T22), and the admin summary can read it.
#
# The subquery looks back 3 hours. With no upload in that window the series is absent.
#
# Litestream creates the counter series at its first upload after a start. Until then
# `portfolio:litestream_backup_age_seconds` counts from the Litestream process start.
# Litestream down: both series are absent. Treat absent as stale.
# Known limit: with no upload in the 3 h window, the age is the time since the Litestream
# start, not the true age. An old start overstates it. A recent restart understates it,
# so `BackupStale` fires up to 75 min late after a restart.
groups:
  - name: backup
    rules:
      - record: portfolio:litestream_last_upload_timestamp_seconds
        expr: >
          max by (job, lxc) (
            max_over_time(
              (timestamp(increase(litestream_replica_operation_total{operation="PUT"}[1m]) > 0))[3h:30s]
            )
          )
      - record: portfolio:litestream_backup_age_seconds
        expr: >
          time() - (
            portfolio:litestream_last_upload_timestamp_seconds
            or max by (job, lxc) (process_start_time_seconds{job="litestream"})
          )
