# Backup recording rules. Plans T20, T21.
#
# Litestream 0.5 uploads to R2 only when the database changes. Each WAL sync with
# changes, and each compaction of new data, is one PUT in
# `litestream_replica_operation_total{operation="PUT"}`. With no writes there are no
# uploads, and the backup stays current. So "time since the last upload" is not a
# staleness signal on a quiet site.
#
# The staleness signal is the backup lag: how long the newest change in the database
# has waited without an upload after it.
#
# - `litestream_txid` rises on every committed write.
# - Both subqueries look back 3 hours. An older change or upload is not seen.
# - Lag is 0 when the last upload is at or after the last change, or when there was no
#   change in 3 hours.
# - Litestream down or not scraped: the lag series is absent. Treat absent as stale.
# - Known limit: a change left without an upload for over 3 hours drops out of the window,
#   and the lag goes back to 0. `BackupStale` fires long before that.
groups:
  - name: backup
    rules:
      - record: portfolio:litestream_last_upload_timestamp_seconds
        expr: >
          max by (job, lxc) (
            max_over_time(
              (timestamp(increase(litestream_replica_operation_total{operation="PUT"}[1m]) > 0))[3h:30s]
            )
          )

      - record: portfolio:litestream_last_change_timestamp_seconds
        expr: >
          max by (job, lxc) (
            max_over_time((timestamp(changes(litestream_txid[1m]) > 0))[3h:30s])
          )

      - record: portfolio:litestream_backup_lag_seconds
        expr: >
          (
            (
              time() - portfolio:litestream_last_change_timestamp_seconds
              unless on (job, lxc)
              (
                portfolio:litestream_last_upload_timestamp_seconds
                >= on (job, lxc) portfolio:litestream_last_change_timestamp_seconds
              )
            )
            or on (job, lxc)
            (0 * max by (job, lxc) (litestream_txid))
          )
          and on (job, lxc)
          (max by (job, lxc) (up{job="litestream"}) == 1)
