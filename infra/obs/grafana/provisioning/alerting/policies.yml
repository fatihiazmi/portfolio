# Notification policy tree. Spec 7a.4, plan T21.
apiVersion: 1

policies:
  - orgId: 1
    receiver: owner
    group_by: ["alertname"]
    # No wait. Each alert name is its own group, so a wait batches nothing. Plan T25 F3.
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: owner-info
        object_matchers:
          - ["severity", "=", "info"]
        group_wait: 0s
        # One message per new lead. A repeat would read as a second lead.
        repeat_interval: 7d
